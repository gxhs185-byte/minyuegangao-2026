/* ═══════════════════════════════════════════

:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f5f5f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --accent-hover:  #0077ed;
  --tint-red:    #ff3b30;
  --tint-orange: #ff9500;
  --tint-green:  #34c759;
  --tint-blue:   #007aff;
  --tint-purple: #af52de;
  --tint-pink:   #ff2d55;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 30px rgba(0,0,0,.12);
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --map-height: 40vh;
  --map-resizer-height: 18px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", "Arial", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Map ── */
.map-shell { position: sticky; top: 0; z-index: 100; background: #fff; }
#map { width: 100%; height: var(--map-height); min-height: 220px; }
.map-resizer {
  height: var(--map-resizer-height); display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.96); border-top: .5px solid var(--separator);
  border-bottom: .5px solid var(--separator); cursor: ns-resize; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.map-resizer::before {
  content: ''; width: 48px; height: 5px; border-radius: 999px;
  background: #c7c7cc; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.05);
  transition: width .18s ease, background .18s ease;
}
.map-resizer:hover::before, .map-resizer.dragging::before { width: 62px; background: var(--accent); }
.map-resizer.dragging { background: #f7fbff; }
.locate-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.locate-btn.active { color: #007aff; }
@keyframes loc-pulse {
  0%   { transform: scale(1); opacity: .55; }
  100% { transform: scale(2.4); opacity: 0; }
}
.loc-pulse {
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(0,122,255,.25);
  animation: loc-pulse 1.6s ease-out infinite;
}

/* ── Tabs ── */
.tabs {
  display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  background: rgba(255,255,255,.85); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); position: sticky;
  top: calc(var(--map-height) + var(--map-resizer-height)); z-index: 99;
  border-bottom: .5px solid var(--separator); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 7px 16px; border-radius: 980px; border: none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .25s ease;
  white-space: nowrap; letter-spacing: -0.01em;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--accent); color: #fff; }

/* ── Main content ── */
.content { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(24px + var(--safe-bottom)); }

/* ── Overview ── */
.hero { text-align: center; padding: 28px 20px 20px; }
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
.hero .subtitle { font-size: 17px; color: var(--text-secondary); margin-top: 6px; font-weight: 400; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.info-card .value { font-size: 15px; font-weight: 600; line-height: 1.4; }
.next-reminder { margin: 0 0 14px; padding: 15px 16px; border-radius: var(--radius-lg); background: linear-gradient(135deg,#eaf4ff,#fff); box-shadow: 0 0 0 1px rgba(0,113,227,.12), var(--shadow-sm); }
.next-reminder.urgent { background: linear-gradient(135deg,#fff2e8,#fff); box-shadow: 0 0 0 1px rgba(255,149,0,.2), var(--shadow-sm); }
.next-reminder-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.next-reminder-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); letter-spacing: .02em; }
.next-reminder-countdown { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; background: rgba(0,113,227,.1); color: var(--accent); font-size: 12px; font-weight: 700; }
.next-reminder.urgent .next-reminder-countdown { background: rgba(255,149,0,.14); color: #c45d00; }
.next-reminder-title { font-size: 17px; font-weight: 700; line-height: 1.35; }
.next-reminder-detail { margin-top: 5px; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
.next-reminder-actions { display: flex; align-items: center; gap: 9px; margin-top: 11px; }
.next-reminder-button { border: 0; border-radius: 10px; padding: 7px 11px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
.next-reminder-pending { margin-top: 11px; padding-top: 10px; border-top: .5px solid var(--separator); color: #c83a32; font-size: 12px; font-weight: 600; line-height: 1.45; }

/* ── Section headers ── */
.section-head { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 20px 0 8px; }

/* ── Day header ── */
.day-head { padding: 20px 0 12px; }
.day-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.day-head p { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }
.weather-card { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: start; background: linear-gradient(135deg,#eef7ff,#fff); border-radius: var(--radius-md); padding: 13px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.weather-icon { font-size: 26px; line-height: 1; }
.weather-main { font-size: 14px; font-weight: 700; }
.weather-wear { grid-column: 2; margin-top: -6px; font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
.weather-note { grid-column: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-tertiary); }
.weather-note a { color: inherit; }
.weather-refresh { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 4px 8px; background: rgba(0,113,227,.09); color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
.weather-refresh:disabled { opacity: .5; }

/* ── Route bar ── */
.route-bar { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); font-size: 13px; color: var(--text-secondary); line-height: 1.7; white-space: pre-line; }
.route-bar strong { color: var(--text-primary); }

/* ── Timeline ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: 20px; width: 1.5px; background: var(--separator); }
.transfer { margin: -1px 0 9px 2px; padding-left: 12px; font-size: 12px; color: var(--text-secondary); line-height: 1.35; }
.transfer::before { content: '↳'; margin-right: 5px; color: var(--accent); font-weight: 700; }
.tl-item { position: relative; margin-bottom: 10px; }
.tl-dot { position: absolute; left: -20px; top: 18px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food    { background: var(--tint-red); }
.tl-dot.spot    { background: var(--tint-blue); }
.tl-dot.hotel   { background: var(--tint-orange); }
.tl-dot.drink   { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }

/* ── Card ── */
.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease; cursor: pointer; }
.card:active { box-shadow: var(--shadow-md); }
.card.map-selected { background: #f0f7ff; box-shadow: 0 0 0 3px rgba(0,122,255,.58), var(--shadow-md); }
.card .time { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; }
.card .name { font-size: 17px; font-weight: 600; margin: 2px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.card .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.45; }

/* Badge */
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.food   { background: rgba(255,59,48,.1);  color: var(--tint-red); }
.badge.spot   { background: rgba(0,122,255,.1);  color: var(--tint-blue); }
.badge.drink  { background: rgba(175,82,222,.1); color: var(--tint-purple); }

/* Budget */
.budget { display: inline-block; margin-top: 6px; padding: 3px 10px; background: var(--bg-grouped); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Payment */
.pays { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pay { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.pay.ok  { background: rgba(52,199,89,.1);  color: var(--tint-green); }
.pay.no  { background: rgba(255,59,48,.08); color: var(--tint-red); }
.pay.idk { background: rgba(255,149,0,.1);  color: var(--tint-orange); }

/* Links row */
.links { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  text-decoration: none !important; transition: filter .2s;
}
.btn:active { filter: brightness(.9); }
.btn.nav    { background: var(--accent); color: #fff; }
.btn.xhs    { background: #ff2442; color: #fff; }
.btn.dp     { background: #ffa700; color: #fff; }
.btn.rsv    { background: var(--tint-green); color: #fff; }

/* Action Sheet */
.as-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.35); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.as-overlay.show { opacity: 1; pointer-events: auto; }
.as-sheet {
  width: 100%; max-width: 420px;
  padding: 0 8px 34px;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.as-overlay.show .as-sheet { transform: translateY(0); }
.as-group {
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-radius: 14px; overflow: hidden; margin-bottom: 8px;
}
.as-group .as-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 16px; font-size: 18px; color: #007aff; font-weight: 500;
  border: none; background: none; width: 100%; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.as-group .as-item + .as-item { border-top: .5px solid rgba(0,0,0,.12); }
.as-group .as-item:active { background: rgba(0,0,0,.06); }
.as-cancel { font-weight: 600; }

/* Details — default open */
.details {
  margin-top: 10px; padding-top: 10px;
  border-top: .5px solid var(--separator);
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
}
.details.closed { display: none; }

/* ── Overview day list ── */
.day-list .card { margin-bottom: 8px; }
.day-list .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* ── Payment summary ── */
.pay-summary { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.pay-summary h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.pay-summary .warn { color: var(--tint-red); }
.pay-summary .ok-text { color: var(--tint-green); }

/* ── Legend ── */
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Leaflet overrides ── */
.leaflet-marker-icon > div { transition: transform .22s ease, box-shadow .22s ease; }
.leaflet-marker-icon.map-marker-selected > div {
  transform: scale(1.35);
  box-shadow: 0 0 0 6px rgba(0,122,255,.25), 0 4px 16px rgba(0,0,0,.3) !important;
}
.leaflet-tooltip.place-name-tooltip {
  padding: 7px 10px; border: none; border-radius: 9px;
  background: rgba(29,29,31,.92); color: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
  font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  white-space: nowrap; pointer-events: none;
}
.leaflet-tooltip-top.place-name-tooltip::before { border-top-color: rgba(29,29,31,.92); }
.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important; }
.leaflet-popup-content { font-size: 14px !important; line-height: 1.5 !important; margin: 12px 14px !important; }
.leaflet-popup-content a { color: var(--accent) !important; }
.leaflet-popup-tip { background: #fff !important; }
.leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; border-radius: 10px !important; background: rgba(255,255,255,.85) !important; -webkit-backdrop-filter: blur(10px) !important; backdrop-filter: blur(10px) !important; border: .5px solid var(--separator) !important; color: var(--text-primary) !important; }
.leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow-md) !important; border: none !important; }
.leaflet-control-attribution { font-size: 9px !important; opacity: .5; }
</style>
</head>

function liveWear(min, max, rain, code, extra='') {
  const parts = [];
  if(max >= 30) parts.push('短袖、透气下装');
  else if(max >= 26) parts.push('短袖为主');
  else if(max >= 22) parts.push('短袖加薄外套');
  else parts.push('长袖和外套');
  if(min <= 20) parts.push('早晚加一层');
  else parts.push('空调车厢可备薄外套');
  if(rain >= 40 || (code >= 51 && code <= 99)) parts.push('带伞或轻薄雨衣，鞋子注意防滑');
  else parts.push('注意防晒补水');
  if(extra) parts.push(extra);
  return parts.join('；') + '。';
}

function weatherCardHtml(d) {
  const w = d.weather;
  let note = '参考天气 · 正在获取最新预报…';
  if(w.live) {
    note = `最新预报 · ${w.updatedAt}更新 · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>`;
  } else if(w.loadState === 'fallback') {
    note = '参考天气 · 实时接口暂不可用，稍后可重试';
  }
  const buttonState = weatherLoading ? ' disabled' : '';
  const buttonText = weatherLoading ? '更新中' : '↻ 更新';
  return `<div class="weather-card" data-weather-day="${d.id}"><div class="weather-icon">${w.icon}</div><div class="weather-main">${w.summary} · ${w.temp}</div><div class="weather-wear">👕 ${w.wear}</div><div class="weather-note"><span>${note}</span><button class="weather-refresh" type="button" onclick="refreshWeather(event)"${buttonState}>${buttonText}</button></div></div>`;
}

let weatherLoading = false;

function updateVisibleWeather() {
  if(cur <= 0) return;
  const d = DAYS.find(x => x.id === cur);
  const oldCard = contentEl.querySelector('.weather-card');
  if(d && oldCard) oldCard.outerHTML = weatherCardHtml(d);
}

async function loadLiveWeather(force=false) {
  if(weatherLoading) return;
  weatherLoading = true;
  DAYS.slice(1).forEach(d => { if(!d.weather.live || force) d.weather.loadState = 'loading'; });
  document.querySelectorAll('.weather-refresh').forEach(b => { b.disabled = true; b.textContent = '更新中'; });
  updateVisibleWeather();

  const groups = {};
  Object.entries(WEATHER_TARGETS).forEach(([dayId, target]) => {
    if(!groups[target.key]) groups[target.key] = { ...target, days: [] };
    groups[target.key].days.push({ dayId:+dayId, target });
  });

  await Promise.allSettled(Object.values(groups).map(async group => {
    const params = new URLSearchParams({
      latitude: group.lat,
      longitude: group.lng,
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
      timezone: 'Asia/Shanghai',
      forecast_days: '16',
      past_days: '10'
    });
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, { cache:'no-store' });
    if(!response.ok) throw new Error(`weather ${response.status}`);
    const data = await response.json();
    group.days.forEach(({dayId, target}) => {
      const i = data.daily?.time?.indexOf(target.date) ?? -1;
      if(i < 0) return;
      const code = Number(data.daily.weather_code[i]);
      const min = Math.round(data.daily.temperature_2m_min[i]);
      const max = Math.round(data.daily.temperature_2m_max[i]);
      const rain = Math.round(data.daily.precipitation_probability_max[i] ?? 0);
      const [icon, text] = WEATHER_CODES[code] || ['🌤️','天气多变'];
      const d = DAYS.find(x => x.id === dayId);
      if(!d) return;
      d.weather = {
        icon,
        summary: `${target.city}${text}，降雨概率 ${rain}%`,
        temp: `${min}–${max}°C`,
        wear: liveWear(min, max, rain, code, target.wearExtra),
        live: true,
        loadState: 'live',
        updatedAt: new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())
      };
    });
  }));

  DAYS.slice(1).forEach(d => { if(!d.weather.live) d.weather.loadState = 'fallback'; });
  weatherLoading = false;
  updateVisibleWeather();
}

function refreshWeather(event) {
  event?.stopPropagation();
  loadLiveWeather(true);
}

function reminderCountdown(ms) {
  const totalMinutes = Math.max(0, Math.ceil(ms / 60000));
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  if(days > 0) return `${days}天${hours ? hours+'小时' : ''}`;
  if(hours > 0) return `${hours}小时${minutes ? minutes+'分钟' : ''}`;
  return `${minutes}分钟`;
}

function nextReminderHtml() {

  const remaining = new Date(next.at) - now;

/* 高德底图使用 GCJ-02；行程数据保留 WGS-84，显示时统一转换，避免标记偏移。 */
const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
function transformLat(x, y) {
  let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
  return r+(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;
}
function transformLng(x, y) {
  let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  return r+(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;
}
function gcj(lat, lng) {
  if(lng<72.004||lng>137.8347||lat<.8293||lat>55.8271) return [lat,lng];
  let dLat=transformLat(lng-105,lat-35), dLng=transformLng(lng-105,lat-35);
  const rad=lat/180*PI, magic=1-EE*Math.sin(rad)*Math.sin(rad), sqrt=Math.sqrt(magic);
  dLat=dLat*180/((A*(1-EE))/(magic*sqrt)*PI);
  dLng=dLng*180/(A/sqrt*Math.cos(rad)*PI);
  return [lat+dLat,lng+dLng];
}
const mapCenter = gcj(HOTEL.lat || 35.69, HOTEL.lng || 116.99);
const map = L.map('map', { center: mapCenter, zoom: 12, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains:['1','2','3','4'], maxZoom:19, attribution:'&copy; 高德地图'
}).addTo(map);

/* ── Resizable map ── */
const mapResizer = document.getElementById('map-resizer');
const mapEl = document.getElementById('map');
const MAP_HEIGHT_KEY = 'trip-map-height';
let resizeFrame = 0;

function mapHeightBounds() {
  return { min: 220, max: Math.max(320, Math.round(window.innerHeight * .72)) };
}
function setMapHeight(px, remember = true) {
  const { min, max } = mapHeightBounds();
  const height = Math.min(max, Math.max(min, Math.round(px)));
  document.documentElement.style.setProperty('--map-height', `${height}px`);
  mapResizer.setAttribute('aria-valuemin', min);
  mapResizer.setAttribute('aria-valuemax', max);
  mapResizer.setAttribute('aria-valuenow', height);
  if (remember) { try { localStorage.setItem(MAP_HEIGHT_KEY, height); } catch (_) {} }
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => map.invalidateSize({ pan: false }));
  return height;
}

let savedMapHeight = 0;
try { savedMapHeight = Number(localStorage.getItem(MAP_HEIGHT_KEY)); } catch (_) {}
if (savedMapHeight) setMapHeight(savedMapHeight, false);

mapResizer.addEventListener('pointerdown', e => {
  e.preventDefault();
  const startY = e.clientY;
  const startHeight = mapEl.getBoundingClientRect().height;
  mapResizer.classList.add('dragging');
  mapResizer.setPointerCapture(e.pointerId);

  const move = ev => setMapHeight(startHeight + ev.clientY - startY);
  const end = ev => {
    mapResizer.classList.remove('dragging');
    if (mapResizer.hasPointerCapture(ev.pointerId)) mapResizer.releasePointerCapture(ev.pointerId);
    mapResizer.removeEventListener('pointermove', move);
    mapResizer.removeEventListener('pointerup', end);
    mapResizer.removeEventListener('pointercancel', end);
    map.invalidateSize({ pan: false });
  };
  mapResizer.addEventListener('pointermove', move);
  mapResizer.addEventListener('pointerup', end);
  mapResizer.addEventListener('pointercancel', end);
});

mapResizer.addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  setMapHeight(mapEl.getBoundingClientRect().height + (e.key === 'ArrowDown' ? 24 : -24));
});

window.addEventListener('resize', () => {
  const current = mapEl.getBoundingClientRect().height;
  setMapHeight(current, false);
});

function icon(color, emoji) {

let markers = [], polylines = [], markerByLoc = {}, selectedMarker = null, activeNameMarker = null;
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'🚃', drink:'🍺' };

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; markerByLoc={}; selectedMarker=null; activeNameMarker=null; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push(gcj(l.lat,l.lng)); }));
    if(pts.length) map.fitBounds(pts, {padding:[30,30]});
    DAYS.slice(1).forEach(d => {
      d.locations.filter(l=>l.time!=='—').forEach(l => {
        const m = L.circleMarker(gcj(l.lat,l.lng), { radius:4, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.9 }).addTo(map);
        m.bindTooltip(l.name, { direction:'top', offset:[0,-7], className:'place-name-tooltip', opacity:1 });
        m.on('click', () => {
          if(activeNameMarker && activeNameMarker!==m) activeNameMarker.closeTooltip();
          activeNameMarker = m;
          m.openTooltip();
        });
        markers.push(m);
      });
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  day.locations.forEach(l => {
    if(!l.lat) return;
    const displayCoord = gcj(l.lat,l.lng);
    const m = L.marker(displayCoord, { icon: icon(day.color, emojis[l.type]||'📌') }).addTo(map);
    m.bindTooltip(l.name, { direction:'top', offset:[0,-18], className:'place-name-tooltip', opacity:1 });
    m.on('click', () => {
      if(activeNameMarker && activeNameMarker!==m) activeNameMarker.closeTooltip();
      activeNameMarker = m;
      selectLocation(day.id, l.name, null, false);
      m.openTooltip();
    });
    markers.push(m);
    markerByLoc[`${day.id}::${l.name}`] = m;
    if(l.time!=='—') coords.push(displayCoord);
  });
  if(coords.length>1) { const pl = L.polyline(coords, { color:day.color, weight:2.5, opacity:.5, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords, { padding:[40,40], maxZoom:14 });
}

function selectLocation(dayIdx, name, card, moveMap = true) {
  const marker = markerByLoc[`${dayIdx}::${name}`];
  if(!marker) return;
  document.querySelectorAll('.card.map-selected').forEach(el=>el.classList.remove('map-selected'));
  if(card) card.classList.add('map-selected');
  if(selectedMarker && selectedMarker.getElement()) selectedMarker.getElement().classList.remove('map-marker-selected');
  if(selectedMarker) selectedMarker.setZIndexOffset(0);
  selectedMarker = marker;
  if(marker.getElement()) marker.getElement().classList.add('map-marker-selected');
  marker.setZIndexOffset(2000);
  if(moveMap) map.flyTo(marker.getLatLng(), 14, { duration:.55 });
}

  }
  if(loc.reserve) lnk += `<a href="${loc.reserve}" target="_blank" class="btn rsv">📅 预约</a>`;
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links')){selectLocation(${dayIdx},'${loc.name.replace(/'/g,"\\'")}',this);toggle('${uid}')}"><div class="time">${loc.time!=='—'?loc.time:'备选'}</div><div class="name">${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?'<div class="budget">'+loc.budget+'</div>':''}${payChips(loc.pay)}<div class="links">${lnk}</div>${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(d.weather) h += weatherCardHtml(d);
  if(main.length) {
    const transfers = TRANSFERS[idx] || [];
    h += '<div class="section-head">行程</div><div class="timeline">';
    main.forEach((l, i) => {
      if(transfers[i]) h += `<div class="transfer">${transfers[i]}</div>`;
      h += locCard(l, idx);
    });
    h += '</div>';
  }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  return h;
}

// ══════════ NAV ══════════
let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (d.id===0?' active':'');
  btn.dataset.day = d.id;
  btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  contentEl.scrollTo({top:0});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function initialDayId() {
  const now = new Date();
  const start = new Date(2026, 8, 26);
  const end = new Date(2026, 9, 5, 23, 59, 59);
  if(now < start || now > end) return 0;
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - start) / 86400000) + 1;
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });

go(initialDayId());
loadLiveWeather();
setInterval(() => {
  if(cur !== 0) return;
  const currentReminder = document.getElementById('next-reminder');
  if(currentReminder) currentReminder.outerHTML = nextReminderHtml();
}, 60000);

/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`;
}
function openAmap(name, lat, lng) {
  if (IN_APP_WEBVIEW) { window.open(amapWebUrl(name, lat, lng)); return; }
  window.location.href = amapAppUrl(name, lat, lng);
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name + ' 中国');
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  // WebView 内 maps:// 通常被拦截，改用 https Apple Maps URL —— iOS 系统会自动拉起 Apple Maps
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>` +
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>` +
    `<button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">🧭 高德地图 App</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
